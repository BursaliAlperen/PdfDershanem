<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF DERSHANEM - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://ss.mrmnd.com/banner.js" data-id="71742" async></script>
    
    <script async src="https://ss.mrmnd.com/interstitial.js" data-mndintid="45a45fca-0f26-4487-bb1c-e158b13246b7"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .page { display: none; animation: fadeIn 0.3s ease-in-out; height: calc(100vh - 180px); overflow-y: auto; padding: 16px; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        .tab-active { color: #2563eb !important; border-top: 2px solid #2563eb; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="h-full flex flex-col">

    <header class="p-4 flex justify-between items-center bg-white border-b border-gray-100 z-[60]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center border border-blue-200"><i class="fas fa-user text-blue-600"></i></div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase">Öğrenci Paneli</p>
                <p id="user-name" class="font-bold text-sm text-slate-800">Yükleniyor...</p>
            </div>
        </div>
        <div class="bg-blue-600 text-white text-[10px] px-3 py-1 rounded-lg font-bold">PRO</div>
    </header>

    <div class="px-4 mt-2">
        <div class="min-h-[80px] bg-white rounded-2xl flex items-center justify-center border border-dashed border-gray-200 overflow-hidden">
            <div id="mnd-71742"></div> </div>
    </div>

    <main class="flex-1 relative overflow-hidden">
        <section id="home" class="page active">
            <div class="bg-blue-600 p-6 rounded-3xl mb-6 shadow-lg relative overflow-hidden text-white">
                <h2 class="text-xl font-bold mb-1">Hoş Geldin!</h2>
                <p class="text-xs opacity-90">Kütüphanedeki PDF'leri açmak için reklam izle.</p>
                <button onclick="switchTab('library')" class="mt-4 bg-white text-blue-600 px-5 py-2 rounded-xl font-bold text-xs btn-active">PDF Listesi</button>
                <i class="fas fa-rocket absolute -right-2 -bottom-2 text-6xl text-white/10 -rotate-12"></i>
            </div>
            <div id="popular-list" class="space-y-3"></div>
        </section>

        <section id="library" class="page">
            <div id="pdf-list" class="space-y-4"></div>
        </section>

        <section id="profile" class="page">
            <div class="bg-white p-6 rounded-3xl border border-gray-100 text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl text-blue-600"><i class="fas fa-graduation-cap"></i></div>
                <h2 id="profile-name" class="text-lg font-bold">Kullanıcı</h2>
                <p id="profile-id" class="text-gray-400 text-xs">ID: ---</p>
            </div>
            <div id="admin-button" class="hidden mt-4">
                <button onclick="switchTab('admin')" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold flex justify-between items-center btn-active">
                    <span>YÖNETİCİ PANELİ</span><i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <section id="admin" class="page">
            <div class="bg-white p-5 rounded-2xl border mb-4">
                <input id="adm-title" type="text" placeholder="PDF Başlığı" class="w-full bg-gray-50 border rounded-xl p-3 text-sm mb-2 outline-none">
                <input id="adm-url" type="text" placeholder="İndirme Linki" class="w-full bg-gray-50 border rounded-xl p-3 text-sm mb-2 outline-none">
                <input id="adm-ads" type="number" placeholder="Kaç Reklam İzlenecek?" class="w-full bg-gray-50 border rounded-xl p-3 text-sm mb-2 outline-none">
                <button onclick="addPdf()" class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold btn-active">SİSTEME KAYDET</button>
            </div>
            <div id="admin-pdf-list" class="space-y-2"></div>
        </section>
    </main>

    <nav class="glass-nav h-20 px-8 flex justify-between items-center z-[100]">
        <button onclick="switchTab('home')" class="nav-btn tab-active flex-1 flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-house text-xl"></i><span class="text-[9px] font-bold">ANA SAYFA</span>
        </button>
        <button onclick="switchTab('library')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-layer-group text-xl"></i><span class="text-[9px] font-bold">KÜTÜPHANE</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn flex-1 flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-user-ninja text-xl"></i><span class="text-[9px] font-bold">PROFİL</span>
        </button>
    </nav>

    <a id="mnd-trigger" href="#reklam-izle" style="display:none;">.</a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const ADMIN_IDS = [8392479231, 7904032877];
        let pdfData = JSON.parse(localStorage.getItem('pdfs_v3')) || [];

        function initApp() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-name').innerText = user.first_name;
                document.getElementById('profile-name').innerText = user.first_name;
                document.getElementById('profile-id').innerText = 'ID: ' + user.id;
                if (ADMIN_IDS.includes(user.id)) document.getElementById('admin-button').classList.remove('hidden');
            }
            renderPdfs();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId)?.classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('tab-active'));
            const btns = document.querySelectorAll('.nav-btn');
            if(tabId === 'home') btns[0].classList.add('tab-active');
            if(tabId === 'library') btns[1].classList.add('tab-active');
            if(tabId === 'profile' || tabId === 'admin') btns[2].classList.add('tab-active');
        }

        function renderPdfs() {
            const list = document.getElementById('pdf-list');
            const adminList = document.getElementById('admin-pdf-list');
            list.innerHTML = ''; adminList.innerHTML = '';

            pdfData.forEach(pdf => {
                const card = `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600"><i class="fas fa-file-pdf"></i></div>
                        <div><h4 class="text-xs font-bold text-slate-800">${pdf.title}</h4><p class="text-[9px] text-gray-400 font-semibold">${pdf.currentAds > 0 ? pdf.currentAds + ' Reklam Gerekli' : 'Hazır'}</p></div>
                    </div>
                    <div>
                        ${pdf.currentAds <= 0 ? 
                        `<button onclick="tg.openLink('${pdf.url}')" class="bg-green-500 text-white px-4 py-2 rounded-xl text-[10px] font-bold">İNDİR</button>` : 
                        `<button onclick="watchAd(${pdf.id})" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold">İZLE</button>`}
                    </div>
                </div>`;
                list.innerHTML += card;
                adminList.innerHTML += `<div class="flex justify-between p-2 bg-gray-50 rounded-lg text-xs mb-1"><span>${pdf.title}</span><button onclick="deletePdf(${pdf.id})" class="text-red-500">SİL</button></div>`;
            });
            document.getElementById('popular-list').innerHTML = list.innerHTML;
        }

        // --- GERÇEK REKLAM TETİKLEYİCİ ---
        function watchAd(pdfId) {
            const trigger = document.getElementById('mnd-trigger');
            
            // 1. Reklam Servisi (Mrmnd) genellikle tıklamaları yakalar.
            // Bu yüzden butona basıldığında gizli bir linke "tıklama" gönderiyoruz.
            trigger.click();

            // 2. Mrmnd Panelinde "On-close" veya "Callback" ayarı yoksa 
            // reklamın açıldığını varsayıp ödülü vermek için gerçekçi bir bekleme ekliyoruz.
            tg.showConfirm("Reklamı izledikten sonra 'Tamam' butonuna basarak ödülünüzü alabilirsiniz.", (ok) => {
                if(ok) {
                    completeAd(pdfId);
                }
            });
        }

        function completeAd(pdfId) {
            const pdf = pdfData.find(p => p.id === pdfId);
            if (pdf && pdf.currentAds > 0) {
                pdf.currentAds--;
                tg.HapticFeedback.notificationOccurred('success');
                saveAndRefresh();
            }
        }

        function addPdf() {
            const title = document.getElementById('adm-title').value;
            const url = document.getElementById('adm-url').value;
            const ads = document.getElementById('adm-ads').value || 1;
            if(!title || !url) return tg.showAlert("Bilgiler eksik!");
            pdfData.push({ id: Date.now(), title, url, currentAds: parseInt(ads) });
            saveAndRefresh();
            tg.showAlert("Eklendi!");
            document.getElementById('adm-title').value = '';
            document.getElementById('adm-url').value = '';
        }

        function deletePdf(id) {
            pdfData = pdfData.filter(p => p.id !== id);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('pdfs_v3', JSON.stringify(pdfData));
            renderPdfs();
        }

        initApp();
    </script>
</body>
</html>
