    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ======================================================= */
        /* === 1. GENİŞLETİLMİŞ CSS (Theming ve Detaylar) === */
        /* ======================================================= */

        /* Kök Değişkenler (Telegram Temasına Uyum) */
        :root {
            --primary-color: var(--tg-theme-link-color, #007AFF);
            --secondary-color: var(--tg-theme-secondary-bg-color, #FFFFFF);
            --background-color: var(--tg-theme-bg-color, #F0F0F0);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --shadow-light: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 5px 20px rgba(0, 0, 0, 0.1);
            --border-color: rgba(153, 153, 153, 0.15);
        }

        /* DARK MODE DÜZELTMELERİ (Telegram WebApp'in koyu moduna uyum) */
        @media (prefers-color-scheme: dark) {
            body[data-theme="dark"] {
                --background-color: #1c1c1d;
                --secondary-color: #2c2c2e;
                --text-color: #FFFFFF;
                --hint-color: #8E8E93;
                --shadow-light: 0 1px 3px rgba(255, 255, 255, 0.1);
                --shadow-medium: 0 5px 20px rgba(255, 255, 255, 0.05);
                --border-color: rgba(255, 255, 255, 0.1);
            }
        }

        html, body {
            height: 100%; 
            overflow-x: hidden; 
            transition: background-color 0.3s;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
        }
        
        .telegram-app {
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .hidden { display: none !important; }

        .content-container {
            flex-grow: 1;
            overflow-y: hidden;
            position: relative;
        }
        
        /* Sayfa Geçişleri */
        .content-page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto; 
            padding: 0; 
            box-sizing: border-box; 
            display: none; 
            flex-direction: column;
            background-color: var(--background-color);
            /* Yumuşak Geçiş Animasyonu */
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .content-page.active { 
            display: flex;
            z-index: 5;
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Navigasyon Çubuğu */
        .navbar { 
            background-color: var(--secondary-color); 
            display: flex; 
            justify-content: space-around; 
            padding: 5px 0 5px; 
            box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.08); 
            z-index: 10; 
            flex-shrink: 0; 
        }

        .nav-item {
            /* ... (Aynı stiller) ... */
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        
        /* LIST STYLES */
        .list-section-title {
            padding: 10px 15px 5px;
            font-size: 13px;
            color: var(--hint-color);
            text-transform: uppercase;
        }
        
        .list-card {
            background-color: var(--secondary-color);
            margin: 0 10px 15px 10px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-light);
        }
        
        .list-item { 
            display: flex; 
            padding: 12px 15px; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            text-decoration: none; 
            color: var(--text-color); 
            cursor: pointer; 
            transition: background-color 0.1s;
        }
        
        .list-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* YENİ: Admin İstatistik Kartları */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 10px;
        }
        .stat-card {
            background-color: var(--secondary-color);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            text-align: center;
        }
        .stat-card h4 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--primary-color);
        }
        .stat-card p {
            margin: 0;
            font-size: 12px;
            color: var(--hint-color);
        }

        /* YENİ: Kullanıcı Listesi ve Admin Yönetimi Stilleri */
        .user-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .user-actions button {
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .user-actions .ban-btn {
            background-color: #FF3B30;
            color: white;
            border-color: #FF3B30;
        }
        .user-actions .unban-btn {
            background-color: #34C759;
            color: white;
            border-color: #34C759;
        }
        
        /* ... (Diğer genel stiller, buttonlar, inputlar, chat stilleri aynı) ... */
        
    </style>
</head>
<body data-theme="light">
<div class="splash-screen" id="splashScreen">
    </div>

<div class="modal-overlay hidden" id="termsModal">
    </div>

<div class="telegram-app" id="app">
    
    <div id="mainAppContent" class="hidden" style="flex-grow: 1; position: relative;">
        
        <div class="content-container">
            
            <div class="content-page active" id="page-home">
                </div>

            <div class="content-page" id="page-chats">
                </div>

            <div class="content-page" id="page-chat-detail" style="padding: 0;">
                </div>


            <div class="content-page" id="page-profile">
                </div>

            <div class="content-page" id="page-search">
                <div class="list-section-title" style="margin-top: 20px;">PDF VE İÇERİK ARAMA</div>
                 <div style="margin: 0 10px 20px 10px; display: flex; gap: 10px;">
                    <input type="text" id="searchInput" placeholder="Aranacak PDF veya Konu Adı" style="flex-grow: 1;">
                    <button onclick="handleSearch()" class="action-button" style="width: auto; margin-top: 0; padding: 10px 15px;"><i class="fas fa-magnifying-glass"></i></button>

                    <input type="file" id="pdfFile" accept=".pdf" style="margin-top: 5px;">
                    
                    <label style="font-size: 14px; margin-top: 15px; font-weight: 500;">PDF Adı (Otomatik Doldurulur):</label>

                    <label style="font-size: 14px; margin-top: 15px; font-weight: 500;">Açıklama/Konu Özeti:</label>
                    <textarea id="pdfDescription" placeholder="PDF'in içeriği, konusu veya ek bilgileri." rows="3" style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 5px; background-color: var(--background-color); color: var(--text-color);"></textarea>

                    <label style="font-size: 14px; margin-top: 15px; font-weight: 500;">Etiketler (Virgülle Ayırın):</label>

                    <button id="uploadButton" class="upload-button" disabled onclick="uploadPDF()">

                <div class="list-section-title">KULLANICI YÖNETİMİ</div>
                <div class="list-card" id="userManagementList">
                     <div style="padding: 15px; text-align: center; color: var(--tg-theme-hint-color);">Kullanıcılar yükleniyor...</div>

        </div>
        
        <div class="navbar">

    <div class="chat-input-area" id="chatInputArea" style="display: none;">

    <div class="modal-overlay hidden" id="errorModal">
        <div class="modal-content" style="max-width: 350px;">
            <h3 id="errorModalTitle" style="color: #FF3B30;"><i class="fas fa-exclamation-triangle"></i> Hata!</h3>
            <p id="errorModalMessage"></p>
            <button onclick="document.getElementById('errorModal').classList.add('hidden')" class="action-button" style="background-color: #FF9500;">Tamam</button>

<script>
    // #######################################################
    // ##### 1. FIREBASE KONFİGÜRASYONU VE BAĞLANTILAR #####
    // #######################################################
    const firebaseConfig = {
        // ... (Config bilgileri aynı) ...
    };
    
    const ADMIN_ID = 123456789; 

    let db, storage;
    let currentUser = null; 
    let is_admin = false;
    let banned_users = {}; // Yeni: Banlı kullanıcıları tutmak için

    try {
        if (!firebase.apps.length) {
             firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database(); 
        storage = firebase.storage(); 
    } catch (e) {
        showErrorModal("Kritik Başlatma Hatası", "Firebase bağlantısı kurulamadı. İnternet bağlantınızı veya yapılandırma ayarlarınızı kontrol edin.");
    }
    
    // YARDIMCI FONKSİYON: Hata/Uyarı Modalı
    function showErrorModal(title, message) {
        document.getElementById('errorModalTitle').innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${title}`;
        document.getElementById('errorModalMessage').textContent = message;
        document.getElementById('errorModal').classList.remove('hidden');
    }
    
    // #######################################################
    // ##### 2. DOM YÜKLEME VE GİRİŞ MANTIKLARI (Genişletildi) #####
    // #######################################################
    
    document.addEventListener('DOMContentLoaded', function() {
        // ... (DOM öğeleri tanımlamaları aynı) ...
        
        // --- Telegram WebApp Başlatma Kontrolü ---
        if (window.Telegram && Telegram.WebApp) {
            try {
                // ... (Tema ve Kullanıcı Bilgisi Yükleme aynı) ...
                 if (Telegram.WebApp.themeParams) {
                    // Telegram'dan gelen koyu mod bilgisini body'ye ekle
                    const isDark = Telegram.WebApp.themeParams.bg_color && isColorDark(Telegram.WebApp.themeParams.bg_color);
                    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                    
                    // Temaları uygula (Önceki kodla aynı)
                    document.documentElement.style.setProperty('--tg-theme-bg-color', Telegram.WebApp.themeParams.bg_color || '#F0F0F0');
                    document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', Telegram.WebApp.themeParams.secondary_bg_color || '#FFFFFF');
                    // ... diğer tema parametreleri
                }
                
                // ... (currentUser ve is_admin belirleme aynı) ...
                
            } catch (e) {
                showErrorModal("TG WebApp Hatası", "Telegram WebApp başlatılırken kritik bir hata oluştu.");
                return;
            }
        } else {
            console.warn("Telegram WebApp objesi bulunamadı. Simülasyon modunda çalışıyor.");
            // Test amaçlı simülasyon kullanıcı ataması yapılabilir
            currentUser = { id: 123456789, first_name: 'Test', last_name: 'Admin', username: 'testadmin' };
            is_admin = currentUser.id === ADMIN_ID;
        }
        
        // ... (Giriş Buton Mantığı ve navigateTo aynı) ...

        loginButton.addEventListener('click', function() {
            if (termsCheckbox.checked && currentUser) {
                // ... (Ekran geçişleri ve kullanıcı kaydı aynı) ...
                
                // YENİ: Banlı Kullanıcı Listesini Çek
                listenToBannedUsers();
                
                // ... (Diğer başlangıç fonksiyonları aynı) ...
            } else if (!currentUser) {
                 showErrorModal("Giriş Engellendi", "Telegram kullanıcı bilgileri alınamadı. Botu tekrar başlatmayı deneyin.");
            } else {
                 document.getElementById('termsModal').classList.remove('hidden'); 
            }
        });
        
        // ... (Navigasyon tıklamaları ve diğer event listener'lar aynı) ...
    });
    
    // Yardımcı Fonksiyon: Renk Koyu mu Kontrolü (CSS Theming İçin)
    function isColorDark(hex) {
        if (!hex || hex.length < 7) return false;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        // Luminosity formülü
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance < 0.5;
    }


    // #######################################################
    // ##### 3. KULLANICI / DB YÖNETİMİ FONKSİYONLARI (Genişletildi) #####
    // #######################################################

    function saveUserToDatabase(user) {
        if (!user || !db) return;
        const userRef = db.ref('users/' + user.id);
        
        try {
            userRef.update({
                id: user.id,
                first_name: user.first_name,
                last_name: user.last_name || '',
                username: user.username || '',
                is_bot: user.is_bot || false,
                is_admin: user.id === ADMIN_ID,
                last_login: firebase.database.ServerValue.TIMESTAMP
            });
        } catch (error) {
            console.error("Kullanıcı DB'ye kaydedilemedi:", error);
            showErrorModal("Veritabanı Hatası", "Kullanıcı bilgileri kaydedilirken bir sorun oluştu.");
        }
    }
    
    // ... (updateProfileInfo aynı) ...
    
    // #######################################################
    // ##### 4. SOHBET SİSTEMİ FONKSİYONLARI (Genişletildi) #####
    // #######################################################
    
    function sendMessage() {
        if (banned_users[currentUser.id]) {
            showErrorModal("Erişim Engellendi", "Yönetici tarafından sohbetten yasaklandınız.");
            return;
        }
        
        // ... (Gönderme mantığı ve error handling eklendi) ...
        const text = document.getElementById('messageInput').value.trim();
        if (!text || !currentUser || !currentChatChannel) return;

        const message = {
            user_id: currentUser.id,
            user_name: currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : ''),
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            image_url: '' 
        };

        try {
            db.ref('chats/' + currentChatChannel).push(message)
                .then(() => {
                    document.getElementById('messageInput').value = '';
                    scrollToBottom();
                })
                .catch(error => {
                    showErrorModal("Mesaj Gönderilemedi", "Veritabanına yazılırken bir sorun oluştu: " + error.message);
                });
        } catch (e) {
            showErrorModal("İletişim Hatası", "Mesajınız gönderilemedi. Lütfen tekrar deneyin.");
        }
    }
    
    // ... (Diğer sohbet fonksiyonları aynı) ...

    // #######################################################
    // ##### 5. PDF VE ARAMA FONKSİYONLARI (Genişletildi) #####
    // #######################################################
    
    function fetchPDFList() {
        try {
            db.ref('pdfs').once('value', snapshot => {
                const pdfs = snapshot.val();
                let count = 0;
                // ... (Listeyi oluşturma aynı) ...
                if (pdfs) {
                    count = Object.keys(pdfs).length;
                    document.getElementById('pdfDownloadList').innerHTML = '';
                    Object.keys(pdfs).reverse().forEach(key => {
                        document.getElementById('pdfDownloadList').appendChild(createPDFListItem(pdfs[key], key));
                    });
                } else {
                    document.getElementById('pdfDownloadList').innerHTML = '<div style="padding: 15px; text-align: center; color: var(--tg-theme-hint-color);">Henüz yüklü PDF bulunmamaktadır.</div>';
                }
                document.getElementById('pdfCount').textContent = count;
                document.getElementById('statTotalPdfs').textContent = count; // Admin stat güncelleme
            });
        } catch (e) {
             showErrorModal("Veritabanı Hatası", "PDF listesi yüklenirken sorun oluştu.");
        }
    }

    // YENİ: PDF Arama Mantığı (Etiket ve Açıklama Dahil)
    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultsEl = document.getElementById('searchResultsList');
        resultsEl.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--tg-theme-link-color);"><i class="fas fa-spinner fa-spin"></i> Aranıyor...</div>';

        if (query.length < 3) {
            resultsEl.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--tg-theme-hint-color);">En az 3 karakter girin.</div>';
            return;
        }
        
        db.ref('pdfs').once('value').then(snapshot => {
            const pdfs = snapshot.val();
            let results = [];

            if (pdfs) {
                Object.keys(pdfs).forEach(key => {
                    const file = pdfs[key];
                    const nameMatch = file.name && file.name.toLowerCase().includes(query);
                    const descMatch = file.description && file.description.toLowerCase().includes(query);
                    const tagMatch = file.tags && file.tags.toLowerCase().includes(query);

                    if (nameMatch || descMatch || tagMatch) {
                        results.push({ key, ...file });
                    }
                });
            }

            resultsEl.innerHTML = '';
            if (results.length > 0) {
                results.forEach(file => {
                     resultsEl.appendChild(createPDFListItem(file, file.key));
                });
                document.getElementById('searchStatus').textContent = `Toplam ${results.length} sonuç bulundu.`;
            } else {
                 resultsEl.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--tg-theme-hint-color);">Aradığınız kriterlere uygun sonuç bulunamadı.</div>';
                 document.getElementById('searchStatus').textContent = `0 sonuç bulundu.`;
            }
        }).catch(e => {
            showErrorModal("Arama Hatası", "Arama işlemi sırasında veritabanı hatası oluştu.");
        });
    }

    // #######################################################
    // ##### 6. ADMİN VE YÖNETİM FONKSİYONLARI (GENİŞLETİLDİ) #####
    // #######################################################

    function uploadPDF() {
        if (!is_admin) return showErrorModal("Yetkisiz Erişim", "Sadece yöneticiler dosya yükleyebilir.");
        
        const fileInput = document.getElementById('pdfFile');
        const fileNameEl = document.getElementById('pdfName');
        const descEl = document.getElementById('pdfDescription'); // Yeni
        const tagsEl = document.getElementById('pdfTags');       // Yeni
        
        const file = fileInput.files[0];
        const pdfName = fileNameEl.value.trim();
        const pdfDescription = descEl.value.trim();
        const pdfTags = tagsEl.value.trim();

        if (!file || !pdfName) {
            return showErrorModal("Eksik Bilgi", "Lütfen bir PDF dosyası seçin ve adını kontrol edin.");
        }
        
        const uploadStatusEl = document.getElementById('uploadStatus');
        uploadStatusEl.textContent = 'Yükleniyor... %0';

        const storageRef = storage.ref(`pdfs/${Date.now()}_${file.name}`);
        const uploadTask = storageRef.put(file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                uploadStatusEl.textContent = `Yükleniyor... %${Math.round(progress)}`;
            }, 
            (error) => {
                uploadStatusEl.textContent = `Yükleme hatası: ${error.message}`;
                showErrorModal("Yükleme Başarısız", "Dosya yüklenirken kritik bir hata oluştu.");
            }, 
            () => {
                uploadStatusEl.textContent = 'Yükleme başarılı. Veritabanı kaydediliyor...';
                uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                    const pdfData = {
                        name: pdfName,
                        description: pdfDescription, // Yeni
                        tags: pdfTags, // Yeni
                        url: downloadURL,
                        uploader_id: currentUser.id,
                        uploader_name: currentUser.first_name + ' ' + (currentUser.last_name || ''),
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    };
                    
                    db.ref('pdfs').push(pdfData)
                        .then(() => {
                            uploadStatusEl.textContent = 'PDF başarıyla eklendi!';
                            // Alanları temizle
                            fileInput.value = '';
                            fileNameEl.value = '';
                            descEl.value = '';
                            tagsEl.value = '';
                            document.getElementById('uploadButton').disabled = true;
                            fetchPDFList(); // Listeyi yenile
                        })
                        .catch(e => {
                            uploadStatusEl.textContent = `DB Kayıt Hatası: ${e.message}`;
                        });
                });
            }
        );
    }
    
    // YENİ: Banlı Kullanıcıları Dinleme
    function listenToBannedUsers() {
        try {
            db.ref('banned_users').on('value', snapshot => {
                banned_users = snapshot.val() || {};
                const count = Object.keys(banned_users).length;
                document.getElementById('statBannedUsers').textContent = count;
                // Eğer kullanıcı banlıysa uyarı verilebilir (sohbet göndermeden önce de kontrol ediliyor)
                if (currentUser && banned_users[currentUser.id]) {
                     showErrorModal("Yasaklama", "Hesabınız yönetici tarafından yasaklanmıştır.");
                }
                // Admin sayfasındaysa listeyi yenile
                if (document.getElementById('page-admin').classList.contains('active')) {
                    fetchUserList();
                }
            });
        } catch(e) {
            console.error("Ban listesi dinlenemedi:", e);
        }
    }

    // YENİ: Kullanıcı Listesini Çekme ve Yönetim Arayüzü
    function fetchUserList() {
        if (!is_admin) return;
        const listEl = document.getElementById('userManagementList');
        listEl.innerHTML = '<div style="padding: 15px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Kullanıcılar listeleniyor...</div>';
        
        db.ref('users').once('value').then(snapshot => {
            const users = snapshot.val();
            listEl.innerHTML = '';
            let totalUsers = 0;
            
            if (users) {
                totalUsers = Object.keys(users).length;
                Object.keys(users).forEach(id => {
                    const user = users[id];
                    const isBanned = !!banned_users[id];
                    listEl.appendChild(createUserListItem(user, isBanned));
                });
            } else {
                 listEl.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--hint-color);">Kayıtlı kullanıcı yok.</div>';
            }
            document.getElementById('statTotalUsers').textContent = totalUsers; // Admin stat güncelleme

        }).catch(e => {
            listEl.innerHTML = '<div style="padding: 15px; color: #FF3B30;">Kullanıcı listesi yüklenirken hata: ' + e.message + '</div>';
        });
    }

    function createUserListItem(user, isBanned) {
        const item = document.createElement('div');
        item.className = 'user-list-item';
        
        item.innerHTML = `
            <div>
                <strong>${user.first_name} ${user.last_name || ''}</strong> 
                <span style="font-size: 12px; color: var(--hint-color); display: block;">@${user.username || 'yok'} | ID: ${user.id}</span>
                <span style="font-size: 12px; color: ${isBanned ? '#FF3B30' : '#34C759'};">${isBanned ? 'YASAKLI' : 'Aktif'}</span>
            </div>
            <div class="user-actions">
                ${isBanned 
                    ? `<button class="unban-btn" onclick="toggleUserBan(${user.id}, false)">Yasağı Kaldır</button>`
                    : `<button class="ban-btn" onclick="toggleUserBan(${user.id}, true)">Yasakla</button>`
                }
                <button onclick="clearUserMessages(${user.id})">Mesaj Sil</button>
            </div>
        `;
        return item;
    }

    function toggleUserBan(userId, banStatus) {
        if (!is_admin) return;
        
        const banRef = db.ref('banned_users/' + userId);
        
        try {
            if (banStatus) {
                banRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP })
                    .then(() => alert(`Kullanıcı ${userId} yasaklandı.`));
            } else {
                banRef.remove()
                    .then(() => alert(`Kullanıcının ${userId} yasağı kaldırıldı.`));
            }
        } catch(e) {
            showErrorModal("İşlem Hatası", "Yasaklama/Yasak kaldırma işlemi başarısız oldu.");
        }
    }
    
    function clearUserMessages(userId) {
        if (!is_admin || !confirm(`ID ${userId} olan kullanıcının tüm mesajlarını silmek istediğinizden emin misiniz? Bu geri alınamaz bir işlemdir.`)) return;
        
        // Bu işlem tüm kanallarda kullanıcıya ait mesajları aramayı ve silmeyi gerektirir.
        // Basitleştirilmiş örnek: Sadece 'test' kanalından siliyoruz. Gerçekte tüm chat kanallarını döngüye almanız gerekir.
        try {
            db.ref('chats/test').orderByChild('user_id').equalTo(userId).once('value', snapshot => {
                let updates = {};
                snapshot.forEach(child => {
                    updates[child.key] = null; // Silmek için null değeri
                });

                if (Object.keys(updates).length > 0) {
                     db.ref('chats/test').update(updates)
                        .then(() => alert(`${Object.keys(updates).length} mesaj başarıyla silindi (test kanalı).`));
                } else {
                    alert("Bu kullanıcının silinecek mesajı bulunamadı.");
                }
            });
        } catch(e) {
             showErrorModal("Silme Hatası", "Mesajlar silinirken bir sorun oluştu.");
        }
    }

</script>
